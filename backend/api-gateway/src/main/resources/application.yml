server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS lives here and nowhere else: one origin for the browser, one config.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            exposedHeaders: [Authorization, Content-Disposition]
            allowCredentials: true
            maxAge: 3600

      routes:
        # Identity paths go to the User Service; everything else under /api/v1
        # belongs to the Investment Service. Order matters — first match wins.
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/contact/**,/api/v1/notifications/**,/api/v1/admin/users/**,/api/v1/admin/contact-messages/**,/api/v1/admin/user-stats/**

        - id: investment-service
          uri: ${INVESTMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
