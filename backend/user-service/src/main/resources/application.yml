server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/investwise_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:cdac}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/investwise_logs}
      auto-index-creation: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:investwise}
    password: ${SPRING_RABBITMQ_PASSWORD:investwise123}
#    username: ${SPRING_RABBITMQ_USERNAME:guest}
#    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  # =========================
  # Gmail SMTP Configuration
  # =========================
  mail:
    host: smtp.gmail.com
    port: 587
    username: investwise.noreply@gmail.com
    password: hizugjhfaiitexgn
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false


investwise:

  frontend-url: http://localhost:5173

  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
    validity-seconds: 28800
    remember-me-seconds: 2592000

  # =========================
  # Application Mail Settings
  # =========================
  mail:
    enabled: true
    from: investwise.noreply@gmail.com


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha


management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    com.investwise: DEBUG